<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body{% if page.custom_class %} class="{{ page.custom_class }}"{% endif %}>
    {% include trust_badge.html %}

    {{ content }}

    <footer class="footer">
      <div class="footer-brand">
        <a class="mlh-footer-logo" href="https://mlh.io/" target="_blank" rel="noopener noreferrer" aria-label="Major League Hacking">
          <img src="{{ site.event.mlh_logo_white }}" alt="Major League Hacking">
        </a>
        <div>
          <strong>{{ site.event.name }} {{ site.event.year }}</strong>
          <span>{{ site.event.date }} at {{ site.event.location }}</span>
        </div>
      </div>
      <div class="footer-links">
        <a href="{{ site.event.code_of_conduct_url }}">Code of Conduct </a>
        <a href="mailto:{{ site.event.email }}">Sponsor Contact</a>
        <a href="mailto:{{ site.event.email }}">Contact</a>
      </div>
    </footer>

    <script src="{{ '/js/makecu.js' | relative_url }}"></script>
    {% include analytics/google_analytics.html ga_id=site.tracking.google_analytics %}
  </body>
</html>
