  about:
    description: >
      MakeCU is a weekend-long hardware hackathon organized by Columbia University Robotics Club.
      Students collaborate on hands-on projects that combine mechanical design, electronics,
      embedded software, and creative problem solving. The 2026 site should stay honest while
      planning is underway: registration, exact venue rooms, sponsor names, hardware inventory,
      prizes, judges, and training links are placeholders until confirmed.

      Beginners are welcome. The goal is to make hardware feel approachable through workshops,
      mentors, team formation, and a supportive environment for building something demoable by
      the end of the weekend.

